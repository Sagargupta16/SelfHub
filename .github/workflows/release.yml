name: Release

# Push a tag like v0.3.0 to publish. npm uses trusted publishing (OIDC) and the
# MCP Registry uses GitHub OIDC, so no tokens are stored in repo secrets.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  publish:
    name: Publish to npm and the MCP Registry
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.11.2

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Check tag, package.json and server.json versions match
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg=$(node -p "require('./package.json').version")
          srv=$(node -p "require('./server.json').version")
          srv_pkg=$(node -p "require('./server.json').packages[0].version")
          echo "tag=$tag package.json=$pkg server.json=$srv server.json package=$srv_pkg"
          test "$tag" = "$pkg"
          test "$tag" = "$srv"
          test "$tag" = "$srv_pkg"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Audit dependencies
        run: pnpm audit --audit-level=high

      - name: Type check
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      # Trusted publishing needs npm 11.5.1 or newer
      - name: Update npm
        run: npm install -g --ignore-scripts npm@12.2.0

      # Skipped when this version is already on npm, so a failed registry step can be re-run
      - name: Publish to npm
        run: |
          version="${GITHUB_REF_NAME#v}"
          if npm view "selfhub-mcp-server@$version" version > /dev/null 2>&1; then
            echo "selfhub-mcp-server@$version is already on npm, skipping"
          else
            npm publish --access public
          fi

      - name: Install mcp-publisher
        env:
          MCP_PUBLISHER_VERSION: v1.8.1
          MCP_PUBLISHER_SHA256: a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc
        run: |
          curl --proto "=https" --proto-redir "=https" --tlsv1.2 -fsSL -o mcp-publisher.tar.gz "https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}/mcp-publisher_linux_amd64.tar.gz"
          echo "${MCP_PUBLISHER_SHA256}  mcp-publisher.tar.gz" | sha256sum -c -
          tar xzf mcp-publisher.tar.gz mcp-publisher

      - name: Publish to the MCP Registry
        run: |
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish
