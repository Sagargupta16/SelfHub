name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12.11.2

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      # Dependabot cannot read the pnpm 12 lockfile, so CI audits it instead
      - name: Audit dependencies
        run: pnpm audit --audit-level=high

      - name: Type check
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Verify build output
        run: test -f build/index.js

      # Spawns build/index.js under the MCP SDK client against mongodb-memory-server
      - name: Test
        run: pnpm test

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Build image
        run: docker compose build selfhub

      - name: Smoke test (MCP initialize over stdio)
        run: |
          printf '%s\n' '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"0"}}}' \
            | timeout 120 docker compose run --rm -T selfhub > response.json || true
          cat response.json
          grep -q '"serverInfo"' response.json

      - name: Stop services
        if: always()
        run: docker compose down -v
